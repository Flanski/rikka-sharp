name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip & setuptools (required for git+ packages)
        run: pip install --upgrade pip setuptools wheel
      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Fetch sherpa-onnx native library (local TTS)
        run: |
          # 23MB 的预编译 .so 不入库（见 .gitignore），构建前按需下载。
          # 版本与 speech/.../com/k2fsa/sherpa/onnx/Tts.kt 必须一致，
          # 否则 JNI 符号不匹配会在运行期抛 UnsatisfiedLinkError。
          bash patch/fetch_sherpa_native.sh "$PWD"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
