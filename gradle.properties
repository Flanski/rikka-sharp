# 堆内存从 2g 提到 4g。
# 原因：加入 sherpa-onnx 的 JNI 类与 commons-compress 后，
# :app:minifyReleaseWithR8 与 :app:lintVitalAnalyzeRelease 在 2g 下会
# OutOfMemoryError: Java heap space 而失败（CI 日志可见），并非代码问题。
# 同时给 metaspace 设上限（原先为 unknown）。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djdk.tls.disabledAlgorithms=
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
systemProp.jdk.tls.disabledAlgorithms=
